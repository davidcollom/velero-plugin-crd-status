---
apiVersion: v1
kind: Namespace
metadata:
  name: argo-events
---
apiVersion: velero.io/v1
kind: Schedule
metadata:
  name: system
  namespace: velero
spec:
  schedule: "0 * 12 12 0"
  template:
    includedResources:
    - "*"
    excludedResources:
    - "pods"
    - "nodes"
    - "events"
    - "orders"
    - "challenges"
    - "certificaterequests"
    - "workflows"
    - "*.phoenix.defence.improbable.io"
    - "FlowSchema"
    - "PriorityLevelConfiguration"
    - "*.gke.io"
    - '*.apiserver.k8s.io'
    excludedNamespaces:
      - "default"
      - "kube-node-lease"
      - "kube-public"
      - "kube-system"
    includeClusterResources: true
    snapshotVolumes: false
    ttl: 1h
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: examplecrd.proj.io
spec:
  conversion:
    strategy: None
  group: proj.io
  names:
    kind: examplecrd
    listKind: exampleCRDList
    plural: examplecrd
    singular: examplecrd
  scope: Namespaced
  versions:
  - name: v1alpha1
    schema:
      openAPIV3Schema:
        properties:
          apiVersion:
            type: string
          kind:
            type: string
          metadata:
            type: object
          spec:
            type: object
            x-kubernetes-preserve-unknown-fields: true
          status:
            type: object
            x-kubernetes-preserve-unknown-fields: true
        required:
        - metadata
        - spec
        type: object
    served: true
    storage: true
    subresources: {}
---
apiVersion: proj.io/v1alpha1
kind: examplecrd
metadata:
  name: hooks
  namespace: argo-events
spec:
  nats:
    native:
      # Optional, defaults to 3. If it is < 3, set it to 3, that is the minimal requirement.
      replicas: 3
      # Optional, authen strategy, "none" or "token", defaults to "none"
      auth: none
      antiAffinity: true
status:
  any:
    data:
      can:
        go:
          in: here
---
apiVersion: proj.io/v1alpha1
kind: examplecrd
metadata:
  name: platform
  namespace: argo-events
spec:
  nats:
    native:
      # Optional, defaults to 3. If it is < 3, set it to 3, that is the minimal requirement.
      replicas: 3
      # Optional, authen strategy, "none" or "token", defaults to "none"
      auth: none
      antiAffinity: true
